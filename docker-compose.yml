version: '3.8'

services:
  backend:
    build: .
    container_name: ai-call-center-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
    environment:
      - DEBUG=True
      - DATABASE_URL=sqlite:///./database/call_center.db
      - USE_MOCK_LLM=True
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload


